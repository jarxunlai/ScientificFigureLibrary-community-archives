name: validate-archive-pr
run-name: sfl-archive-validation-v2 base=${{ github.event.pull_request.base.sha }} head=${{ github.event.pull_request.head.sha }}

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  validate:
    name: sfl-community-archive-policy-v1
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout trusted base validators
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - name: Checkout untrusted candidate without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
      - name: Run trusted policy unit tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover --start-directory trusted/tests --pattern 'test_*.py'
      - name: Enforce append-only archive addition policy
        id: policy
        shell: bash
        run: |
          set -euo pipefail
          python3 trusted/scripts/compare_pr_trees.py trusted candidate --github-output "$GITHUB_OUTPUT"
      - name: Validate and safely extract archive
        shell: bash
        env:
          ARCHIVE_PATH: ${{ steps.policy.outputs.archive }}
          EXPECTED_TEMPLATE_ID: ${{ steps.policy.outputs.template_id }}
          EXPECTED_RELEASE_VERSION: ${{ steps.policy.outputs.release_version }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/sfl-archive-validation"
          rm -rf "$work"
          python3 trusted/scripts/validate_archive.py \
            --archive "$ARCHIVE_PATH" \
            --staging "$work/submission" \
            --render-root "$work/render-root" \
            --expected-template-id "$EXPECTED_TEMPLATE_ID" \
            --expected-release-version "$EXPECTED_RELEASE_VERSION"
      - name: Build reviewed fixed-R renderer
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull=false \
            --tag sfl-archive-renderer:r-4.4.3-v1 \
            trusted/container
          docker image inspect sfl-archive-renderer:r-4.4.3-v1 \
            --format '{{json .RepoDigests}} {{.Id}}' \
            | tee "$RUNNER_TEMP/sfl-archive-validation/renderer-image.txt"
          {
            echo '### Reviewed renderer image identity'
            echo '```text'
            cat "$RUNNER_TEMP/sfl-archive-validation/renderer-image.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Re-render untrusted template in hardened container
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/sfl-archive-validation"
          install -d -m 0777 "$work/output"
          timeout --signal=KILL 180s docker run --rm \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --cpus 2 \
            --memory 2g \
            --memory-swap 2g \
            --pids-limit 128 \
            --ulimit nofile=1024:1024 \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=268435456 \
            --tmpfs /output:rw,noexec,nosuid,nodev,size=134217728,mode=1777 \
            --mount "type=bind,src=$work/render-root,dst=/submission,readonly" \
            sfl-archive-renderer:r-4.4.3-v1 \
            /submission /output \
            > "$work/output/preview.png"
      - name: Verify rendered PNG identity and canonical RGBA digest
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/sfl-archive-validation"
          python3 trusted/scripts/validate_archive.py \
            --staging "$work/submission" \
            --rendered "$work/output/preview.png" \
            | tee "$work/validation-report.json"
