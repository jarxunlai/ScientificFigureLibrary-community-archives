name: publish-renderer-bootstrap
run-name: sfl-renderer-bootstrap trusted=${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      - renderer/**
      - scripts/audit_renderer_rootfs.py
      - .github/workflows/publish-renderer-bootstrap.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: sfl-renderer-bootstrap-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  inspect-lock:
    if: >-
      github.repository == 'jarxunlai/ScientificFigureLibrary-community-archives' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      publish_bootstrap_images: ${{ steps.lock.outputs.publish_bootstrap_images }}
    steps:
      - name: Checkout exact trusted main revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Inspect disabled-intake renderer lock
        id: lock
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import tomllib
          from pathlib import Path

          lock = json.loads(Path("renderer/renderer-lock.json").read_text(encoding="utf-8"))
          if lock.get("schema") != "figure-library.archive-renderer-lock.v1":
              raise SystemExit("unexpected renderer lock schema")
          if lock.get("bootstrapPublicationMode") != "trusted_main_build_audit_push_same_image":
              raise SystemExit("unexpected renderer bootstrap publication mode")
          if lock.get("publishBootstrapImages") is not True:
              raise SystemExit("trusted main bootstrap image publication is not enabled")
          if lock.get("v2IntakeEnabled") is not False:
              raise SystemExit("bootstrap workflow requires v2 intake to remain disabled")
          if lock.get("trustedLinuxBuildVerified") is not False:
              raise SystemExit("source lock must not claim Linux evidence before the trusted-main run")
          if lock.get("artifactLockStatus") != "resolved_exact_direct_and_transitive_artifact_hashes":
              raise SystemExit("bootstrap publication requires a fully resolved artifact lock")
          expected_rootfs_audit = {
              "schema": "figure-library.archive-renderer-rootfs-inventory.v1",
              "script": "scripts/audit_renderer_rootfs.py",
              "requiresExactPushedImage": True,
              "forbidsToolAliasesAndHardlinks": True,
          }
          if lock.get("rootfsAudit") != expected_rootfs_audit:
              raise SystemExit("unexpected renderer rootfs audit contract")
          artifact_lock = lock.get("artifactLock", {})
          if artifact_lock.get("format") != "pixi-lock-v7":
              raise SystemExit("unexpected renderer artifact lock format")
          if artifact_lock.get("artifactCount") != 222 or artifact_lock.get("artifactsWithSha256") != 222:
              raise SystemExit("renderer lock must bind 222 exact artifacts and SHA-256 values")
          expected_builder = "ghcr.io/prefix-dev/pixi@sha256:ad4daaf2f85798f3f88d0489a3b4a7e92c33358709560fb5adf83242803cccbe"
          expected_runtime = "docker.io/library/debian@sha256:5ae3c39ebd15e229dcedd5cee596b2497182493d41ff162e824ba13fc1b2b867"
          if artifact_lock.get("builderImage") != expected_builder or artifact_lock.get("runtimeImage") != expected_runtime:
              raise SystemExit("renderer OCI foundations do not match the reviewed digests")
          expected_direct = {
              "python": "==3.12.12", "r-base": "==4.4.3",
              "r-ggplot2": "==3.5.2", "r-scales": "==1.4.0",
              "r-dplyr": "==1.1.4", "r-tidyr": "==1.3.1",
              "r-readr": "==2.1.5", "r-jsonlite": "==1.9.1",
              "numpy": "==2.2.6", "pandas": "==2.2.3",
              "matplotlib": "==3.10.3", "seaborn": "==0.13.2",
              "fontconfig": "==2.18.3", "fonts-conda-ecosystem": "==1",
              "fonts-conda-forge": "==1",
          }
          manifest = tomllib.loads(Path("renderer/pixi.toml").read_text(encoding="utf-8"))
          if manifest.get("workspace", {}).get("platforms") != ["linux-64"] or manifest.get("dependencies") != expected_direct:
              raise SystemExit("renderer direct dependency manifest differs from the reviewed exact contract")
          package_blocks = []
          current = None
          lock_lines = Path("renderer/pixi.lock").read_text(encoding="utf-8").splitlines()
          for line in lock_lines:
              if line.startswith("- conda: "):
                  if current is not None:
                      package_blocks.append(current)
                  current = {"url": line.removeprefix("- conda: "), "sha256": None}
              elif current is not None and line.startswith("  sha256: "):
                  current["sha256"] = line.removeprefix("  sha256: ")
          if current is not None:
              package_blocks.append(current)
          if len(package_blocks) != 222 or len({item["url"] for item in package_blocks}) != 222:
              raise SystemExit("expected 222 unique locked artifacts")
          if any(not item["url"].startswith("https://conda.anaconda.org/conda-forge/") for item in package_blocks):
              raise SystemExit("renderer lock contains a non-conda-forge artifact URL")
          if any(item["sha256"] is None or len(item["sha256"]) != 64 or any(character not in "0123456789abcdef" for character in item["sha256"]) for item in package_blocks):
              raise SystemExit("every renderer artifact must have one SHA-256 value")
          if sum(line.startswith("  sha256: ") for line in lock_lines) != 222:
              raise SystemExit("renderer lock must contain exactly one SHA-256 per artifact")
          environment_urls = [line.removeprefix("      - conda: ") for line in lock_lines if line.startswith("      - conda: ")]
          if len(environment_urls) != 222 or len(set(environment_urls)) != 222 or set(environment_urls) != {item["url"] for item in package_blocks}:
              raise SystemExit("renderer environment references and locked artifact records differ")
          for renderer in ("r", "python"):
              descriptor = lock.get("renderers", {}).get(renderer, {})
              if descriptor.get("publishedImageDigest") is not None:
                  raise SystemExit("bootstrap source must not claim an unknown or unreviewed registry digest")
              if descriptor.get("baseImage") != expected_runtime:
                  raise SystemExit("renderer does not use the reviewed digest-pinned runtime base")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("publish_bootstrap_images=true\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("### Disabled-intake renderer bootstrap lock\n\n")
              summary.write(f"- trusted revision: `{os.environ['GITHUB_SHA']}`\n")
              summary.write("- publish_bootstrap_images=true\n")
              summary.write("- v2_intake_enabled=false\n")
              summary.write("- source-pinned image digests remain null until this run supplies real GHCR evidence\n")
          PY

  build-audit-push:
    needs: inspect-lock
    if: >-
      needs.inspect-lock.outputs.publish_bootstrap_images == 'true' &&
      github.repository == 'jarxunlai/ScientificFigureLibrary-community-archives' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - renderer: r
            dockerfile: renderer/r/Dockerfile
            image: ghcr.io/jarxunlai/sfl-archive-renderer-r
          - renderer: python
            dockerfile: renderer/python/Dockerfile
            image: ghcr.io/jarxunlai/sfl-archive-renderer-python
    steps:
      - name: Checkout exact trusted main revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Build exact frozen disabled-intake renderer
        id: build
        shell: bash
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
          IMAGE: ${{ matrix.image }}
          RENDERER: ${{ matrix.renderer }}
        run: |
          set -euo pipefail
          tag="${IMAGE}:main-${GITHUB_SHA}"
          docker build --pull --platform linux/amd64 \
            --file "$DOCKERFILE" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "$tag" \
            renderer
          image_id="$(docker image inspect "$tag" --format '{{.Id}}')"
          test -n "$image_id"
          {
            echo "tag=$tag"
            echo "image_id=$image_id"
          } >> "$GITHUB_OUTPUT"
      - name: Verify locked runtimes and disabled-intake canary
        shell: bash
        env:
          TAG: ${{ steps.build.outputs.tag }}
          EXPECTED_IMAGE_ID: ${{ steps.build.outputs.image_id }}
        run: |
          set -euo pipefail
          docker run --rm "$TAG" --verify-runtime
          canary="$RUNNER_TEMP/sfl-renderer-disabled-canary"
          rm -rf "$canary"
          mkdir -p "$canary/input" "$canary/output"
          chmod 0777 "$canary/output"
          set +e
          timeout --signal=KILL 30s docker run --rm \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --cpus 1 \
            --memory 1g \
            --memory-swap 1g \
            --pids-limit 64 \
            --ulimit nofile=256:256 \
            --tmpfs /tmp:rw,noexec,nosuid,nodev \
            --mount "type=bind,src=$canary/input,dst=/submission,readonly" \
            --mount "type=bind,src=$canary/output,dst=/output" \
            "$TAG" --input-dir /submission --output /output/preview.png \
            >"$canary/stdout.txt" 2>"$canary/stderr.txt"
          status=$?
          set -e
          if test "$status" -eq 0; then
            echo 'bootstrap runner unexpectedly accepted a product-neutral render request' >&2
            exit 1
          fi
          test "$status" -ne 124 -a "$status" -ne 137
          grep -Fx 'v2 intake is disabled for this renderer bootstrap' "$canary/stderr.txt" >/dev/null
          test ! -e "$canary/output/preview.png"
          test "$(docker image inspect "$TAG" --format '{{.Id}}')" = "$EXPECTED_IMAGE_ID"
      - name: Audit the exact image rootfs and executable inventory
        id: audit
        shell: bash
        env:
          TAG: ${{ steps.build.outputs.tag }}
          EXPECTED_IMAGE_ID: ${{ steps.build.outputs.image_id }}
        run: |
          set -euo pipefail
          container_id="$(docker create "$TAG")"
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
          test "$(docker container inspect "$container_id" --format '{{.Image}}')" = "$EXPECTED_IMAGE_ID"
          docker export --output rootfs.tar "$container_id"
          test ! -e rootfs-executables.json
          python3 scripts/audit_renderer_rootfs.py rootfs.tar --inventory rootfs-executables.json \
            | tee rootfs-audit.json
          test "$(docker image inspect "$TAG" --format '{{.Id}}')" = "$EXPECTED_IMAGE_ID"
          inventory_sha="$(python3 - <<'PY'
          import hashlib
          from pathlib import Path
          print(hashlib.sha256(Path('rootfs-executables.json').read_bytes()).hexdigest())
          PY
          )"
          echo "inventory_sha256=$inventory_sha" >> "$GITHUB_OUTPUT"
      - name: Authenticate to GHCR after all audits pass
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
      - name: Push the exact locally audited image
        id: push
        shell: bash
        env:
          IMAGE: ${{ matrix.image }}
          TAG: ${{ steps.build.outputs.tag }}
          EXPECTED_IMAGE_ID: ${{ steps.build.outputs.image_id }}
        run: |
          set -euo pipefail
          test "$(docker image inspect "$TAG" --format '{{.Id}}')" = "$EXPECTED_IMAGE_ID"
          docker push "$TAG" | tee push-output.txt
          digest="$(sed -n 's/^.*digest: \(sha256:[0-9a-f]\{64\}\).*$/\1/p' push-output.txt | tail -n 1)"
          test -n "$digest"
          remote="${IMAGE}@${digest}"
          docker buildx imagetools inspect "$remote" >/dev/null
          test "$(docker image inspect "$TAG" --format '{{.Id}}')" = "$EXPECTED_IMAGE_ID"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Record real disabled-intake build evidence
        shell: bash
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          IMAGE: ${{ matrix.image }}
          IMAGE_ID: ${{ steps.build.outputs.image_id }}
          INVENTORY_SHA: ${{ steps.audit.outputs.inventory_sha256 }}
        run: |
          set -euo pipefail
          {
            echo "### Published ${{ matrix.renderer }} disabled-intake renderer"
            echo
            echo "- trusted revision: \`${GITHUB_SHA}\`"
            echo "- local audited image id: \`${IMAGE_ID}\`"
            echo "- executable inventory SHA-256: \`${INVENTORY_SHA}\`"
            echo "- registry image: \`${IMAGE}@${DIGEST}\`"
            echo "- v2_intake_enabled=false"
            echo "- this real digest is build evidence only; a later reviewed policy PR must pin it before intake"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove registry credentials
        if: always()
        shell: bash
        run: docker logout ghcr.io || true
